<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Topkapi Developments | Leads</title>
<meta name="theme-color" content="#191e7a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Topkapi Leads">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<style>
  html, body { margin: 0; height: 100%; background: #f4f6fb; overflow: hidden; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
  .loading { position: fixed; inset: 0; display: grid; place-items: center; font-family: Tahoma, sans-serif; color: #475569; }
  .loading img { width: 180px; display: block; margin: 0 auto 14px; }
  .loading a { color: #2a33a8; font-size: 13px; }
</style>
</head>
<body>
<div class="loading" id="loading">
  <div style="text-align:center">
    <img src="icon-512.png" alt="Topkapi Developments">
    <div>جاري التحميل…</div>
    <div style="margin-top:18px"><a id="direct" href="#">لو الصفحة مافتحتش اضغط هنا</a></div>
  </div>
</div>
<script>
  // ⬇️ لينك السيستم (Apps Script) — لو اتغير، غيّره هنا بس
  var APP_URL = 'https://script.google.com/macros/s/AKfycbyM3Rf2qYdI8ajM57JyndGmrJgksTFXE48HpIjoX00MMz9eom5nT0Tt5h57Tdm3wf6Y/exec';

  document.getElementById('direct').href = APP_URL;
  var f = document.createElement('iframe');
  f.src = APP_URL;
  f.title = 'Topkapi Leads';
  f.allow = 'clipboard-write';
  f.onload = function () { document.getElementById('loading').style.display = 'none'; };
  document.body.appendChild(f);
</script>
</body>
</html>
